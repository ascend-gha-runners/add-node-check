name: linux-aarch64-test-hook_user-script-error
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: linux-test-lwt
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:8.2.rc1-910b-ubuntu22.04-py3.11
    steps:
      - name: Show runner info
        run: |
          echo "===== runner basic info ====="
          echo "hostname: $(hostname)"
          echo "uname:    $(uname -a)"
          echo "arch:     $(uname -m)"
          echo "whoami:   $(whoami)"
          echo "pwd:      $(pwd)"
          exit 666
      - name: Show NPU info
        run: |
          echo "===== npu-smi info ====="
          if command -v npu-smi >/dev/null 2>&1; then
            npu-smi info || echo "npu-smi exited non-zero"
          else
            echo "npu-smi not found in PATH"
          fi
      - name: Network sanity
        run: |
          echo "===== network ====="
          curl -fsS -o /dev/null -w "github.com -> %{http_code}\n" https://github.com || true
